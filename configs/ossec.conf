<!-- ================================================================
     Configuration agent Wazuh — VM Windows cible
     Laboratoire de Détection Personnel — Purple Team Home Lab
     ================================================================
     IP manager : 192.168.56.10
     Nom agent  : WIN-CIBLE-01
     OS         : Windows Server 2022 Core
     ================================================================ -->

<ossec_config>

  <!-- === Connexion au manager === -->
  <client>
    <server>
      <address>192.168.56.10</address>
      <port>1514</port>
      <protocol>tcp</protocol>
    </server>
    <config-profile>windows</config-profile>
    <notify_time>10</notify_time>
    <time-reconnect>60</time-reconnect>
    <auto_restart>yes</auto_restart>
    <crypto_method>aes</crypto_method>
    <enrollment>
      <enabled>yes</enabled>
      <agent_name>WIN-CIBLE-01</agent_name>
    </enrollment>
  </client>

  <!-- === Buffer de l'agent (lissage du débit) === -->
  <client_buffer>
    <disabled>no</disabled>
    <queue_size>5000</queue_size>
    <events_per_second>500</events_per_second>
  </client_buffer>

  <!-- === Collecte des journaux d'événements Windows === -->

  <!-- Journal Application -->
  <localfile>
    <location>Application</location>
    <log_format>eventchannel</log_format>
  </localfile>

  <!-- Journal Sécurité (filtré pour limiter le bruit) -->
  <localfile>
    <location>Security</location>
    <log_format>eventchannel</log_format>
    <query>Event/System[
      EventID != 5152 and
      EventID != 5157 and
      EventID != 5158 and
      EventID != 5447
    ]</query>
  </localfile>

  <!-- Journal Système -->
  <localfile>
    <location>System</location>
    <log_format>eventchannel</log_format>
  </localfile>

  <!-- Canal Sysmon — source principale pour la détection MITRE ATT&CK -->
  <localfile>
    <location>Microsoft-Windows-Sysmon/Operational</location>
    <log_format>eventchannel</log_format>
  </localfile>

  <!-- Journal des réponses actives -->
  <localfile>
    <location>active-response\active-responses.log</location>
    <log_format>syslog</log_format>
  </localfile>

  <!-- === Surveillance de l'intégrité des fichiers (FIM) === -->
  <syscheck>
    <disabled>no</disabled>
    <frequency>43200</frequency>
    <scan_on_start>yes</scan_on_start>

    <!-- Dossiers critiques surveillés -->
    <directories check_all="yes">%WINDIR%\System32\drivers\etc</directories>
    <directories check_all="yes">%WINDIR%\System32\WindowsPowerShell\v1.0</directories>
    <directories check_all="yes" realtime="yes">%PROGRAMDATA%\Microsoft\Windows\Start Menu\Programs\Startup</directories>

    <!-- Exclusions pour éviter le bruit -->
    <ignore>%WINDIR%\SysNative\wbem</ignore>
    <ignore>%WINDIR%\SysNative\config\systemprofile</ignore>
  </syscheck>

  <!-- === Évaluation de la configuration (SCA) === -->
  <sca>
    <enabled>yes</enabled>
    <scan_on_start>yes</scan_on_start>
    <interval>12h</interval>
    <skip_nfs>yes</skip_nfs>
  </sca>

  <!-- === Inventaire système === -->
  <wodle name="syscollector">
    <disabled>no</disabled>
    <interval>1h</interval>
    <scan_on_start>yes</scan_on_start>
    <hardware>yes</hardware>
    <os>yes</os>
    <network>yes</network>
    <packages>yes</packages>
    <ports all="yes">yes</ports>
    <processes>yes</processes>
  </wodle>

  <!-- === Réponse active === -->
  <active-response>
    <disabled>no</disabled>
    <ca_store>wpk_root.pem</ca_store>
    <ca_verification>yes</ca_verification>
  </active-response>

  <!-- === Format des logs internes === -->
  <logging>
    <log_format>plain</log_format>
  </logging>

</ossec_config>
